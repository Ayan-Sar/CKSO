[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ckso"
version = "1.0.0"
description = "Constrained Koopman Spectral Operator for spectral estimation of echocardiographic cine dynamics"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "opencv-python>=4.8",
    "tqdm>=4.65",
    "openpyxl>=3.1",
    "scikit-image>=0.21",
]

[project.optional-dependencies]
camus = ["nibabel>=5.0", "SimpleITK>=2.3"]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["ckso*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
